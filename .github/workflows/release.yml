name: Build and Release

on:
  push:
    tags:
      - "custom-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Maccy.xcodeproj \
            -scheme Maccy

      - name: Build universal app
        run: |
          xcodebuild \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            build

      - name: Package application
        run: |
          mkdir -p dist
          codesign --force --deep --sign - build/DerivedData/Build/Products/Release/Maccy.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Release/Maccy.app \
            dist/Maccy.zip
          shasum -a 256 dist/Maccy.zip > dist/SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Maccy.zip \
            dist/SHA256SUMS.txt \
            --title "Maccy custom build $GITHUB_REF_NAME" \
            --generate-notes
